<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Камень, ножницы, бумага</title>
<script defer src="index.js"></script><link href="index.css" rel="stylesheet"></head>
<body>

  <div class="scoreboard">
    <div class="score-block">
      <div class="score-number" id="winScore">0</div>
      <div class="score-label">Вы</div>
    </div>
    <div class="score-divider">:</div>
    <div class="score-block">
      <div class="score-number" id="loseScore">0</div>
      <div class="score-label">Компьютер</div>
    </div>
  </div>

  <h1 id="result">Сделайте ход</h1>

  <div class="buttons">
    <button onclick="play('камень')">Камень</button>
    <button onclick="play('ножницы')">Ножницы</button>
    <button onclick="play('бумага')">Бумага</button>
  </div>

  <p class="hint">Камень бьёт ножницы, ножницы — бумагу, бумага — камень</p>

  <h2>История игр</h2>
  <ul id="historyList"></ul>

  <div class="reset-row">
    <button id="resetBtn" onclick="resetGame()">Начать заново</button>
  </div>

</body>
</html>
